<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>CORE-NEXUS · Enterprise Network Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
:root {
  /* Default — Carbon Teal */
  --bg:         #0b0d11;
  --bg-1:       #11141a;
  --bg-2:       #161a21;
  --bg-3:       #1c2129;
  --bg-hover:   #1f242e;
  --border:     #232831;
  --border-2:   #2e3540;
  --border-3:   #3b4452;
  --text:       #e6e8ec;
  --text-2:     #a4abb6;
  --text-3:     #6b7380;
  --text-4:     #444b56;
  --accent:     #4ec9c6;       /* desaturated teal */
  --accent-2:   #2a8a87;
  --accent-bg:  rgba(78,201,198,0.10);
  --accent-bd:  rgba(78,201,198,0.28);
  --green:      #6cc28b;
  --green-bg:   rgba(108,194,139,0.12);
  --amber:      #d4a05a;
  --amber-bg:   rgba(212,160,90,0.12);
  --red:        #d96a6a;
  --red-bg:     rgba(217,106,106,0.12);
  --shadow:     0 1px 0 rgba(255,255,255,0.02), 0 4px 12px rgba(0,0,0,0.35);
  --radius:     8px;
  --radius-sm:  5px;
  --radius-lg:  12px;

  --font-ui:   'IBM Plex Sans', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;

  --row-h:     34px;
  --pad-x:     20px;
  --pad-y:     14px;
}

[data-accent="amber"] {
  --accent: #e6b265; --accent-2: #a37433;
  --accent-bg: rgba(230,178,101,0.10); --accent-bd: rgba(230,178,101,0.28);
}
[data-accent="violet"] {
  --accent: #9d8cf0; --accent-2: #5a4ab8;
  --accent-bg: rgba(157,140,240,0.10); --accent-bd: rgba(157,140,240,0.28);
}
[data-accent="lime"] {
  --accent: #b5d36b; --accent-2: #6b8a2a;
  --accent-bg: rgba(181,211,107,0.10); --accent-bd: rgba(181,211,107,0.28);
}

[data-density="compact"] { --row-h: 28px; --pad-x: 14px; --pad-y: 10px; }
[data-density="comfortable"] { --row-h: 40px; --pad-x: 24px; --pad-y: 18px; }

[data-theme="light"] {
  --bg:         #f5f6f8;
  --bg-1:       #ffffff;
  --bg-2:       #f9fafb;
  --bg-3:       #f0f2f5;
  --bg-hover:   #ebedf1;
  --border:     #e3e6eb;
  --border-2:   #d3d7de;
  --border-3:   #b8bec7;
  --text:       #14171c;
  --text-2:     #4a5260;
  --text-3:     #6b7380;
  --text-4:     #9ba2ad;
  --accent:     #1a8a87;
  --accent-2:   #14706e;
  --accent-bg:  rgba(26,138,135,0.08);
  --accent-bd:  rgba(26,138,135,0.25);
  --shadow:     0 1px 2px rgba(20,30,50,0.06), 0 1px 0 rgba(255,255,255,1) inset;
}

* { box-sizing: border-box; }
html, body { margin:0; padding:0; background: var(--bg); color: var(--text); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; }

/* ─── Scrollbar ─── */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-3); }

/* ─── App shell ─── */
.app {
  display: grid;
  grid-template-columns: 280px 1fr;
  grid-template-rows: 52px 1fr;
  grid-template-areas: "logo header" "sidebar main";
  min-height: 100vh;
}

/* ─── Topbar logo cell ─── */
.brand {
  grid-area: logo;
  display: flex; align-items: center; gap: 10px;
  padding: 0 18px;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  background: var(--bg-1);
}
.brand-mark {
  width: 22px; height: 22px;
  border-radius: 4px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
  position: relative;
  flex-shrink: 0;
}
.brand-mark::before, .brand-mark::after {
  content: ""; position: absolute; inset: 0;
}
.brand-mark::before {
  background:
    linear-gradient(90deg, transparent 45%, rgba(255,255,255,0.45) 45%, rgba(255,255,255,0.45) 55%, transparent 55%),
    linear-gradient(0deg,  transparent 45%, rgba(255,255,255,0.45) 45%, rgba(255,255,255,0.45) 55%, transparent 55%);
  mix-blend-mode: overlay;
}
.brand-mark::after {
  border: 1px solid rgba(255,255,255,0.25); border-radius: 4px;
}
.brand-name {
  font-family: var(--font-mono); font-weight: 700; font-size: 13px; letter-spacing: 0.5px;
  color: var(--text);
}
.brand-name em { color: var(--accent); font-style: normal; }

/* ─── Header ─── */
.header {
  grid-area: header;
  display: flex; align-items: center;
  padding: 0 var(--pad-x);
  border-bottom: 1px solid var(--border);
  background: var(--bg-1);
  gap: 18px;
}
.header-crumbs {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-mono); font-size: 12px; color: var(--text-3);
}
.header-crumbs .sep { color: var(--text-4); }
.header-crumbs .here { color: var(--text); }
.header-spacer { flex: 1; }
.header-actions { display: flex; align-items: center; gap: 8px; }

.session-pill {
  display: inline-flex; align-items: center; gap: 8px;
  height: 28px; padding: 0 12px 0 10px;
  border-radius: 100px;
  background: var(--green-bg);
  border: 1px solid rgba(108,194,139,0.30);
  color: var(--green);
  font-size: 12px; font-weight: 500;
  white-space: nowrap;
}
.session-pill .dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--green);
  box-shadow: 0 0 0 3px rgba(108,194,139,0.20);
  animation: pulse 2.4s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(108,194,139,0.30); }
  50%     { box-shadow: 0 0 0 5px rgba(108,194,139,0.05); }
}
.session-pill .proj { font-family: var(--font-mono); color: var(--text); font-weight: 500; }
.session-pill .count { color: var(--text-3); font-family: var(--font-mono); font-size: 11px; }

.btn {
  height: 28px; padding: 0 12px;
  display: inline-flex; align-items: center; gap: 6px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-2);
  background: var(--bg-2);
  color: var(--text);
  font-family: var(--font-ui); font-size: 12px; font-weight: 500;
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
}
.btn:hover { background: var(--bg-3); border-color: var(--border-3); }
.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #0b0d11;
  font-weight: 600;
}
.btn.primary:hover { background: var(--accent); filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--bg-3); color: var(--text); }
.btn.icon-only { padding: 0; width: 28px; justify-content: center; }
.btn .ico { width: 14px; height: 14px; }

/* ─── Sidebar ─── */
.sidebar {
  grid-area: sidebar;
  background: var(--bg-1);
  border-right: 1px solid var(--border);
  padding: 0;
  overflow-y: auto;
  display: flex; flex-direction: column;
}
.side-group { padding: 16px 18px; border-bottom: 1px solid var(--border); }
.side-group:last-child { border-bottom: none; }
.side-title {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 600;
  letter-spacing: 1.4px; text-transform: uppercase;
  color: var(--text-3);
  margin: 0 0 10px 0;
  display: flex; align-items: center; gap: 6px;
}
.side-title::before {
  content: ""; display: inline-block; width: 6px; height: 1px; background: var(--text-4);
}
.side-row { margin-bottom: 10px; }
.side-row:last-child { margin-bottom: 0; }
.side-row label {
  display: block;
  font-size: 11px; color: var(--text-3); margin-bottom: 4px;
  font-weight: 500;
}
.field {
  width: 100%; height: 30px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: var(--font-mono); font-size: 12px;
  padding: 0 10px;
  outline: none;
  transition: border-color 0.12s, background 0.12s;
}
.field:focus { border-color: var(--accent); background: var(--bg-3); }
select.field { appearance: none; padding-right: 26px;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10' fill='none'><path d='M2 3.5L5 6.5L8 3.5' stroke='%236b7380' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat: no-repeat; background-position: right 10px center;
}
.field-hint {
  font-size: 10px; color: var(--text-4);
  font-family: var(--font-mono);
  margin-top: 4px; letter-spacing: 0.2px;
}
.field-hint.ok { color: var(--green); }
.field-hint.warn { color: var(--amber); }

.toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 0;
}
.toggle-row .lbl { font-size: 12px; color: var(--text-2); }
.toggle {
  width: 30px; height: 17px; border-radius: 100px;
  background: var(--border-2); position: relative; cursor: pointer;
  transition: background 0.15s;
}
.toggle::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 13px; height: 13px; border-radius: 50%; background: var(--text-2);
  transition: left 0.15s, background 0.15s;
}
.toggle.on { background: var(--accent); }
.toggle.on::after { left: 15px; background: #0b0d11; }

.creds {
  margin-top: 4px;
  display: flex; flex-direction: column; gap: 6px;
  font-family: var(--font-mono); font-size: 11px;
}
.creds .line { display: flex; align-items: center; gap: 8px; color: var(--text-3); }
.creds .line .k { color: var(--text-4); width: 38px; }
.creds .line .v { color: var(--text); }

/* ─── Main ─── */
.main {
  grid-area: main;
  padding: 22px var(--pad-x);
  overflow-y: auto;
  background: var(--bg);
}
.main-inner { max-width: 1280px; margin: 0 auto; }

/* ─── Page header strip ─── */
.page-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 18px;
  gap: 24px;
}
.page-head h1 {
  margin: 0;
  font-family: var(--font-ui);
  font-size: 20px; font-weight: 600; letter-spacing: -0.3px;
  color: var(--text);
}
.page-head .sub {
  font-family: var(--font-mono); font-size: 11px;
  color: var(--text-3); margin-top: 4px;
  letter-spacing: 0.3px;
}
.page-head .meta {
  display: flex; gap: 8px;
  font-family: var(--font-mono); font-size: 11px;
  color: var(--text-3);
}
.meta-chip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 24px; padding: 0 10px;
  background: var(--bg-1); border: 1px solid var(--border);
  border-radius: 100px; color: var(--text-2);
}
.meta-chip .k { color: var(--text-4); }
.meta-chip .v { color: var(--text); }

/* ─── Tabs ─── */
.tabs {
  display: flex; align-items: stretch;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
  gap: 2px;
}
.tab {
  position: relative;
  padding: 10px 16px 12px;
  font-family: var(--font-ui); font-size: 13px; font-weight: 500;
  color: var(--text-3);
  cursor: pointer;
  border: none; background: transparent;
  display: inline-flex; align-items: center; gap: 8px;
  border-bottom: 1px solid transparent; margin-bottom: -1px;
  transition: color 0.12s;
  white-space: nowrap;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: var(--accent); }
.tab .tab-count {
  font-family: var(--font-mono); font-size: 10px;
  background: var(--bg-2); color: var(--text-3);
  padding: 1px 6px; border-radius: 100px; border: 1px solid var(--border);
}
.tab.active .tab-count { background: var(--accent-bg); color: var(--accent); border-color: var(--accent-bd); }

/* ─── Sections / panels ─── */
.panel {
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 16px;
}
.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-1);
}
.panel-head .title {
  display: flex; align-items: center; gap: 10px;
}
.panel-head h2 {
  font-size: 13px; font-weight: 600; margin: 0;
  color: var(--text);
  letter-spacing: -0.1px;
}
.panel-head .desc {
  font-family: var(--font-mono); font-size: 11px;
  color: var(--text-3); margin-left: 8px;
}
.panel-body { padding: 16px; }

/* Form grid */
.form-grid {
  display: grid; gap: 12px;
  grid-template-columns: repeat(3, 1fr);
}
.form-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
.form-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
.form-cell label {
  display: block;
  font-size: 11px; color: var(--text-3); margin-bottom: 5px;
  font-weight: 500;
}

/* Inline KPIs / Metrics */
.kpi-strip {
  display: grid; gap: 8px;
  grid-template-columns: repeat(5, 1fr);
}
.kpi {
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  position: relative;
}
.kpi .kpi-label {
  font-family: var(--font-mono); font-size: 10px;
  color: var(--text-3); letter-spacing: 1px; text-transform: uppercase;
  margin-bottom: 6px;
  display: flex; align-items: center; gap: 6px;
}
.kpi .kpi-label .ico { color: var(--text-4); }
.kpi .kpi-value {
  font-family: var(--font-mono); font-size: 22px; font-weight: 600;
  color: var(--text); letter-spacing: -0.5px;
  line-height: 1;
}
.kpi .kpi-delta {
  font-family: var(--font-mono); font-size: 10px;
  color: var(--text-3); margin-top: 6px;
}
.kpi .kpi-delta.up { color: var(--green); }
.kpi .kpi-delta.down { color: var(--red); }
.kpi.accent::before {
  content: ""; position: absolute; inset: 0 auto 0 0; width: 2px;
  background: var(--accent); border-radius: var(--radius) 0 0 var(--radius);
}

/* Chips */
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px; height: 20px;
  border-radius: 100px;
  font-family: var(--font-mono); font-size: 10px; font-weight: 500;
  letter-spacing: 0.3px;
  background: var(--bg-2); color: var(--text-2);
  border: 1px solid var(--border);
}
.chip.accent { background: var(--accent-bg); color: var(--accent); border-color: var(--accent-bd); }
.chip.green  { background: var(--green-bg); color: var(--green); border-color: rgba(108,194,139,0.25); }
.chip.amber  { background: var(--amber-bg); color: var(--amber); border-color: rgba(212,160,90,0.25); }
.chip.red    { background: var(--red-bg); color: var(--red); border-color: rgba(217,106,106,0.25); }
.chip .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

/* Vendor pill */
.vendor-pick {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
}
.vendor-opt {
  border: 1px solid var(--border);
  background: var(--bg-2);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  display: flex; align-items: center; gap: 10px;
  cursor: pointer;
  transition: border-color 0.12s, background 0.12s;
}
.vendor-opt:hover { border-color: var(--border-3); }
.vendor-opt.sel { border-color: var(--accent); background: var(--accent-bg); }
.vendor-opt .vlogo {
  width: 26px; height: 26px; border-radius: 6px;
  display: grid; place-items: center;
  font-family: var(--font-mono); font-weight: 700; font-size: 12px;
  flex-shrink: 0;
  background: var(--bg-3); color: var(--text-2);
  border: 1px solid var(--border);
}
.vendor-opt.sel .vlogo { background: var(--accent); color: #0b0d11; border-color: var(--accent); }
.vendor-opt .vname {
  font-size: 12px; font-weight: 600; color: var(--text);
}
.vendor-opt .vdesc {
  font-family: var(--font-mono); font-size: 10px; color: var(--text-3);
}

/* VLAN editor table */
.vlan-table {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--bg-1);
}
.vlan-row {
  display: grid;
  grid-template-columns: 50px 70px 1fr 1fr 1fr 100px 28px;
  align-items: center;
  height: var(--row-h);
  border-bottom: 1px solid var(--border);
  font-family: var(--font-mono); font-size: 12px;
}
.vlan-row:last-child { border-bottom: none; }
.vlan-row.head {
  background: var(--bg-2);
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 1px; text-transform: uppercase;
  color: var(--text-3);
  height: 32px;
}
.vlan-row .cell { padding: 0 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vlan-row .cell.idx { color: var(--text-4); }
.vlan-row .cell.vid { color: var(--accent); font-weight: 600; }
.vlan-row .cell.nm input {
  width: 100%; height: 22px; padding: 0 6px;
  background: transparent; border: 1px solid transparent;
  border-radius: 3px;
  font-family: var(--font-mono); font-size: 12px; color: var(--text);
  outline: none;
}
.vlan-row .cell.nm input:hover { border-color: var(--border); }
.vlan-row .cell.nm input:focus { border-color: var(--accent); background: var(--bg-2); }
.vlan-row .cell.ip { color: var(--text); }
.vlan-row .cell.ip6 { color: var(--text-2); font-size: 11px; }
.vlan-row .cell.status { display: flex; justify-content: flex-end; padding-right: 12px; }
.vlan-row .cell.del {
  display: grid; place-items: center; cursor: pointer; color: var(--text-4);
  height: 100%;
}
.vlan-row .cell.del:hover { color: var(--red); background: var(--red-bg); }

/* Add row */
.vlan-add {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px;
  border-top: 1px dashed var(--border-2);
  background: var(--bg-2);
  font-family: var(--font-mono); font-size: 11px;
  color: var(--text-3);
}
.vlan-add .plus {
  width: 18px; height: 18px; border-radius: 4px;
  background: var(--bg-3); display: grid; place-items: center;
  color: var(--text-2);
  font-weight: 700;
}
.vlan-add:hover { color: var(--text); background: var(--bg-3); cursor: pointer; }
.vlan-add:hover .plus { background: var(--accent); color: #0b0d11; }

/* Device grid */
.device-grid {
  display: grid; gap: 10px;
  grid-template-columns: repeat(4, 1fr);
}
.dev-card {
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  position: relative;
  transition: border-color 0.12s, transform 0.12s;
}
.dev-card:hover { border-color: var(--border-3); }
.dev-card .top {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.dev-card .host {
  font-family: var(--font-mono); font-size: 13px; font-weight: 600;
  color: var(--text); letter-spacing: -0.2px;
}
.dev-card .stat-led {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 3px var(--green-bg);
}
.dev-card .meta {
  display: grid; gap: 4px;
  font-family: var(--font-mono); font-size: 11px;
  color: var(--text-3);
}
.dev-card .meta .row {
  display: flex; justify-content: space-between;
}
.dev-card .meta .row .v { color: var(--text); }
.dev-card .bar {
  height: 3px; border-radius: 2px; background: var(--bg-3);
  margin-top: 10px; overflow: hidden;
}
.dev-card .bar .fill {
  height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2));
  width: 80%;
}

/* Code preview */
.code-tabs {
  display: flex; align-items: center;
  border-bottom: 1px solid var(--border);
  background: var(--bg-1);
}
.code-tab {
  padding: 8px 14px;
  font-family: var(--font-mono); font-size: 11px;
  color: var(--text-3); cursor: pointer;
  border-bottom: 1px solid transparent;
  margin-bottom: -1px;
  display: inline-flex; align-items: center; gap: 6px;
}
.code-tab.active { color: var(--text); border-bottom-color: var(--accent); }
.code-tab .dot { width: 6px; height: 6px; border-radius: 50%; }
.code-tab.deploy .dot { background: var(--green); }
.code-tab.rollback .dot { background: var(--amber); }
.code-tab .lines { color: var(--text-4); margin-left: 4px; }
.code-tabs .spacer { flex: 1; }
.code-tabs .code-action {
  padding: 0 12px; height: 100%;
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-mono); font-size: 11px; color: var(--text-3);
  cursor: pointer; border-left: 1px solid var(--border);
}
.code-tabs .code-action:hover { color: var(--text); background: var(--bg-2); }

.code-block {
  background: #07090d;
  padding: 14px 0;
  max-height: 360px; overflow: auto;
  font-family: var(--font-mono); font-size: 12px; line-height: 1.55;
}
[data-theme="light"] .code-block { background: #f3f5f8; }

.code-line {
  display: grid; grid-template-columns: 44px 1fr;
  padding: 0 14px 0 0;
}
.code-line .ln {
  text-align: right; padding-right: 14px;
  color: var(--text-4); user-select: none;
  font-size: 11px;
}
.code-line:hover { background: rgba(255,255,255,0.02); }
[data-theme="light"] .code-line:hover { background: rgba(0,0,0,0.03); }
.code-line .tx { color: var(--text-2); white-space: pre; }
.tk-cmd { color: var(--text); }
.tk-key { color: var(--accent); }
.tk-num { color: #d4a05a; }
.tk-str { color: #9d8cf0; }
.tk-cmt { color: var(--text-4); font-style: italic; }
.tk-op  { color: var(--text-3); }
.tk-ip  { color: #6cc28b; }

/* Stepper */
.stepper {
  display: inline-flex; align-items: stretch;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  overflow: hidden; height: 30px;
}
.stepper button {
  width: 26px; background: var(--bg-2); border: none; color: var(--text-2);
  font-family: var(--font-mono); font-size: 14px; cursor: pointer;
}
.stepper button:hover { background: var(--bg-3); color: var(--accent); }
.stepper input {
  width: 50px; text-align: center;
  background: var(--bg-1); border: none; border-left: 1px solid var(--border); border-right: 1px solid var(--border);
  color: var(--text); font-family: var(--font-mono); font-size: 12px;
  outline: none;
}

/* Topology mini visualization */
.topo-card {
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 16px;
}
.topo-svg { width: 100%; height: 180px; display: block; }

/* Side rail on the right (HA panel) */
.split { display: grid; grid-template-columns: 1fr 320px; gap: 16px; align-items: start; }
@media (max-width: 1100px) { .split { grid-template-columns: 1fr; } }

/* HA radio cards */
.ha-list { display: grid; gap: 6px; }
.ha-opt {
  border: 1px solid var(--border);
  background: var(--bg-2);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  cursor: pointer;
  display: grid; grid-template-columns: 16px 1fr;
  gap: 10px; align-items: start;
  transition: border-color 0.12s, background 0.12s;
}
.ha-opt:hover { border-color: var(--border-3); }
.ha-opt.sel { border-color: var(--accent); background: var(--accent-bg); }
.ha-radio {
  width: 14px; height: 14px; border-radius: 50%;
  border: 1.5px solid var(--border-3);
  margin-top: 2px;
  position: relative;
}
.ha-opt.sel .ha-radio { border-color: var(--accent); }
.ha-opt.sel .ha-radio::after {
  content: ""; position: absolute; inset: 2px;
  border-radius: 50%; background: var(--accent);
}
.ha-opt .ha-name { font-size: 12px; font-weight: 500; color: var(--text); }
.ha-opt .ha-desc { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-3); margin-top: 2px; }

/* Subnav */
.sub-actions {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 16px;
}
.search {
  position: relative; flex: 1; max-width: 360px;
}
.search input {
  width: 100%; height: 30px;
  background: var(--bg-1); border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 0 10px 0 30px;
  font-family: var(--font-mono); font-size: 12px; color: var(--text);
  outline: none;
}
.search input:focus { border-color: var(--accent); }
.search .ico {
  position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
  width: 14px; height: 14px; color: var(--text-4);
}

/* Footer status */
.statusbar {
  position: sticky; bottom: 0;
  display: flex; align-items: center; gap: 16px;
  height: 26px; padding: 0 var(--pad-x);
  font-family: var(--font-mono); font-size: 10.5px;
  color: var(--text-3);
  background: var(--bg-1); border-top: 1px solid var(--border);
  margin-top: 20px;
}
.statusbar .item { display: inline-flex; align-items: center; gap: 6px; }
.statusbar .item .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 2px var(--green-bg); }
.statusbar .spacer { flex: 1; }

/* keyboard hint */
.kbd {
  display: inline-flex; align-items: center; justify-content: center;
  height: 18px; min-width: 18px; padding: 0 5px;
  border-radius: 4px;
  background: var(--bg-2); border: 1px solid var(--border); border-bottom-width: 2px;
  font-family: var(--font-mono); font-size: 10px; color: var(--text-2);
}

/* tooltip-ish info row */
.note {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  background: var(--accent-bg);
  border: 1px solid var(--accent-bd);
  border-left-width: 2px;
  font-family: var(--font-mono); font-size: 11px;
  color: var(--text-2);
  margin-bottom: 14px;
}
.note .ic {
  width: 16px; height: 16px; flex-shrink: 0;
  border-radius: 50%; background: var(--accent); color: #0b0d11;
  display: grid; place-items: center; font-weight: 700; font-size: 10px;
}
.note b { color: var(--accent); font-weight: 600; }

/* mini progress dots */
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--border-2); }
.dots i.on { background: var(--accent); }

/* ─── Resumen Overlay ─── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(6px);
  z-index: 100;
  display: grid; place-items: center;
  padding: 24px;
  animation: fade 0.15s ease-out;
}
[data-theme="light"] .overlay { background: rgba(30,40,60,0.35); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.modal {
  width: min(1100px, 100%);
  max-height: 90vh;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: 0 30px 80px rgba(0,0,0,0.55);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 22px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-1);
}
.modal-head .titles h2 {
  margin: 0; font-size: 16px; font-weight: 600;
}
.modal-head .titles .meta {
  font-family: var(--font-mono); font-size: 11px; color: var(--text-3);
  margin-top: 3px; letter-spacing: 0.2px;
}
.modal-head .close {
  width: 30px; height: 30px;
  display: grid; place-items: center;
  border-radius: 6px;
  cursor: pointer; color: var(--text-3);
  border: 1px solid var(--border);
  background: var(--bg-2);
}
.modal-head .close:hover { background: var(--bg-3); color: var(--text); }
.modal-body { padding: 20px 22px; overflow-y: auto; }

.summary-grid {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
  margin-bottom: 20px;
}

.summary-section {
  margin-bottom: 22px;
}
.summary-section h3 {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 1.4px; text-transform: uppercase;
  color: var(--text-3); margin: 0 0 10px 0;
  display: flex; align-items: center; gap: 8px;
}
.summary-section h3 .count {
  background: var(--bg-2); color: var(--text-2);
  border: 1px solid var(--border);
  border-radius: 100px; padding: 1px 8px;
  font-size: 10px; letter-spacing: 0;
}

.dev-list {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--bg-1);
}
.dev-list-row {
  display: grid;
  grid-template-columns: 22px 1fr 90px 1fr 90px 110px 70px;
  align-items: center;
  height: 38px;
  border-bottom: 1px solid var(--border);
  font-family: var(--font-mono); font-size: 12px;
  cursor: pointer;
  transition: background 0.1s;
}
.dev-list-row:last-child { border-bottom: none; }
.dev-list-row:hover { background: var(--bg-2); }
.dev-list-row.head {
  background: var(--bg-2);
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-3);
  height: 30px; cursor: default;
}
.dev-list-row.head:hover { background: var(--bg-2); }
.dev-list-row .c { padding: 0 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dev-list-row .ico { color: var(--text-4); display: grid; place-items: center; padding-left: 8px; }
.dev-list-row .host { color: var(--text); font-weight: 500; }
.dev-list-row .vendor { color: var(--accent); }

.log-table {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  font-family: var(--font-mono); font-size: 11.5px;
}
.log-row {
  display: grid;
  grid-template-columns: 150px 80px 1fr;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
}
.log-row:last-child { border-bottom: none; }
.log-row .ts { color: var(--text-4); }
.log-row .tp { }
.log-row .ds { color: var(--text-2); }
</style>
</head>

<script src="api.js"></script>

<script type="text/babel" src="vlan-editor.jsx"></script>
<script type="text/babel" src="code-preview.jsx"></script>
<script type="text/babel" src="tabs-content.jsx"></script>
<script type="text/babel" src="resumen.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
